name: Forex Alert

# Quando parte il controllo
on:
  schedule:
    # Una volta all'ora, al minuto 5 (orario UTC): cosi' la candela 1H si e'
    # appena chiusa. Lo script dentro filtra la fascia oraria italiana.
    - cron: "5 * * * *"
  workflow_dispatch:   # permette anche l'avvio manuale dal sito di GitHub

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ricorda lo stato del controllo precedente tra un'esecuzione e l'altra.
      # La chiave e' sempre diversa (run_id), cosi' ogni volta salva lo stato
      # aggiornato; "restore-keys" recupera l'ultimo stato salvato.
      - name: Ripristina memoria stato
        uses: actions/cache@v4
        with:
          path: stato_forex.json
          key: forex-stato-${{ github.run_id }}
          restore-keys: |
            forex-stato-

      - name: Installa le librerie
        run: pip install --quiet yfinance numpy requests

      - name: Esegui il controllo forex
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_forex.py
