name: Forex Alert

# Quando parte il controllo
on:
  schedule:
    # Ogni 30 minuti, ai minuti 5 e 35 (orario UTC): cosi' il controllo cade
    # poco dopo la chiusura/meta' della candela. Lo script dentro filtra la
    # fascia oraria italiana, il weekend e decide quando inviare.
    - cron: "5,35 * * * *"
  workflow_dispatch:   # avvio manuale dal sito di GitHub (invia sempre un TEST)

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ricorda lo stato del controllo precedente tra un'esecuzione e l'altra.
      - name: Ripristina memoria stato
        uses: actions/cache@v4
        with:
          path: stato_forex.json
          key: forex-stato-${{ github.run_id }}
          restore-keys: |
            forex-stato-

      - name: Installa le librerie
        run: pip install --quiet yfinance numpy requests

      - name: Esegui il controllo forex
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_forex.py
